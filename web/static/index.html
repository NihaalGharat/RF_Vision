<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RF Vision — Research Console</title>
<link rel="stylesheet" href="/static/css/tokens.css">
<link rel="stylesheet" href="/static/css/app.css">
<script type="importmap">
{"imports": {
  "three": "/static/vendor/three.module.js",
  "three/addons/": "/static/vendor/"
}}
</script>
</head>
<body>
<a class="skip-link" href="#panels">Skip to console content</a>
<div id="source-banner" class="source-banner" role="status" aria-live="polite" hidden></div>
<header class="topbar">
  <div class="brand">
    <span class="brand-mark">RF</span>
    <div class="brand-text">
      <strong>RF VISION</strong>
      <small>CSI research console · <span id="contract-version">contract v1</span></small>
    </div>
  </div>
  <div class="topbar-status">
    <span id="conn-dot" class="conn-dot conn-offline" title="connection"></span>
    <span id="conn-label" class="conn-label">DISCONNECTED</span>
    <span id="clock" class="clock">--:--:--</span>
  </div>
</header>
<div id="statusband" class="statusband" aria-label="System status summary">
  <span class="sb-item"><span class="sb-label">state</span><span class="sb-value" id="sb-state">…</span></span>
  <span class="sb-item"><span class="sb-label">observation</span><span class="sb-value" id="sb-obs">…</span></span>
  <span class="sb-item"><span class="sb-label">rf evidence</span><span class="sb-value" id="sb-conf">…</span></span>
  <span class="sb-item"><span class="sb-label">nodes</span><span class="sb-value" id="sb-nodes">…</span></span>
  <span class="sb-item"><span class="sb-label">frame</span><span class="sb-value" id="sb-fresh">…</span></span>
</div>
<nav class="tabs" role="tablist" aria-label="Console sections">
  <button class="tab active" role="tab" id="tab-overview" data-tab="overview" aria-selected="true" aria-controls="panel-overview">Overview</button>
  <button class="tab" role="tab" id="tab-sensing" data-tab="sensing" aria-selected="false" aria-controls="panel-sensing">Sensing</button>
  <button class="tab" role="tab" id="tab-rffield" data-tab="rffield" aria-selected="false" aria-controls="panel-rffield">RF Field</button>
  <button class="tab" role="tab" id="tab-insights" data-tab="insights" aria-selected="false" aria-controls="panel-insights">Insights</button>
  <button class="tab" role="tab" id="tab-session" data-tab="session" aria-selected="false" aria-controls="panel-session">Session</button>
  <button class="tab" role="tab" id="tab-system" data-tab="system" aria-selected="false" aria-controls="panel-system">System</button>
</nav>
<main id="panels">
  <section id="panel-overview" class="panel active" role="tabpanel" aria-labelledby="tab-overview" tabindex="0"></section>
  <section id="panel-sensing" class="panel" role="tabpanel" aria-labelledby="tab-sensing" tabindex="0" hidden></section>
  <section id="panel-rffield" class="panel" role="tabpanel" aria-labelledby="tab-rffield" tabindex="0" hidden></section>
  <section id="panel-insights" class="panel" role="tabpanel" aria-labelledby="tab-insights" tabindex="0" hidden></section>
  <section id="panel-session" class="panel" role="tabpanel" aria-labelledby="tab-session" tabindex="0" hidden></section>
  <section id="panel-system" class="panel" role="tabpanel" aria-labelledby="tab-system" tabindex="0" hidden></section>
</main>
<footer class="foot">
  <span id="provenance-line">provenance: loading…</span>
  <span>RF Vision research instrument — estimates are not conclusions</span>
</footer>
<script type="module" src="/static/js/app.js"></script>
</body>
</html>
