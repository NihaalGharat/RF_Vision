<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RF Vision — Research Console</title>
<link rel="stylesheet" href="/static/css/tokens.css">
<link rel="stylesheet" href="/static/css/app.css">
<script type="importmap">
{"imports": {
  "three": "/static/vendor/three.module.js",
  "three/addons/": "/static/vendor/"
}}
</script>
</head>
<body>
<a class="skip-link" href="#panels">Skip to console content</a>
<div id="source-banner" class="source-banner" role="status" aria-live="polite" hidden></div>
<header class="topbar">
  <div class="brand">
    <span class="brand-mark">RF</span>
    <div class="brand-text">
      <strong>RF VISION</strong>
      <small>CSI research console · <span id="contract-version">contract v1</span></small>
    </div>
  </div>
  <div class="topbar-status">
    <span id="conn-dot" class="conn-dot conn-offline" title="connection"></span>
    <span id="conn-label" class="conn-label">DISCONNECTED</span>
    <span id="clock" class="clock">--:--:--</span>
  </div>
</header>
<div id="statusband" class="statusband" aria-label="System status summary">
  <span class="sb-item"><span class="sb-label">state</span><span class="sb-value" id="sb-state">…</span></span>
  <span class="sb-item"><span class="sb-label">observation</span><span class="sb-value" id="sb-obs">…</span></span>
  <span class="sb-item"><span class="sb-label">rf evidence</span><span class="sb-value" id="sb-conf">…</span></span>
  <span class="sb-item"><span class="sb-label">nodes</span><span class="sb-value" id="sb-nodes">…</span></span>
  <span class="sb-item"><span class="sb-label">frame</span><span class="sb-value" id="sb-fresh">…</span></span>
</div>
<nav class="tabs" role="tablist" aria-label="Console sections">
  <button class="tab active" role="tab" id="tab-overview" data-tab="overview" aria-selected="true" aria-controls="panel-overview"><svg width="18" height="18" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 8.2 8 3.5l5 4.7V13a.5.5 0 0 1-.5.5h-9A.5.5 0 0 1 3 13z"/><path d="M6.2 13.5v-3.6h3.6v3.6"/></svg><span>Overview</span></button>
  <button class="tab" role="tab" id="tab-sensing" data-tab="sensing" aria-selected="false" aria-controls="panel-sensing"><svg width="18" height="18" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M1.8 8h2.2l1.4-4.2 2.6 8.4 2-5.6 1 1.4h3.2"/></svg><span>Sensing</span></button>
  <button class="tab" role="tab" id="tab-rffield" data-tab="rffield" aria-selected="false" aria-controls="panel-rffield"><svg width="18" height="18" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4.2" y="4.2" width="7.6" height="7.6" rx="1" transform="rotate(45 8 8)"/><circle cx="8" cy="8" r="1.1" fill="currentColor" stroke="none"/></svg><span>RF Field</span></button>
  <button class="tab" role="tab" id="tab-research" data-tab="research" aria-selected="false" aria-controls="panel-research"><svg width="18" height="18" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6.3 2.5h3.4M7 2.5V6l-3.4 5.9a1 1 0 0 0 .9 1.6h7a1 1 0 0 0 .9-1.6L9 6V2.5"/><path d="M5.4 10h5.2"/></svg><span>Research</span></button>
  <button class="tab" role="tab" id="tab-system" data-tab="system" aria-selected="false" aria-controls="panel-system"><svg width="18" height="18" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true"><circle cx="8" cy="8" r="2.2"/><path d="M8 1.5v2M8 12.5v2M1.5 8h2M12.5 8h2M3.4 3.4l1.4 1.4M11.2 11.2l1.4 1.4M12.6 3.4l-1.4 1.4M4.8 11.2l-1.4 1.4"/></svg><span>System</span></button>
  <button class="rail-theme" id="rail-theme" title="Toggle light / dark theme">
    <svg width="18" height="18" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M13.2 10.2A5.6 5.6 0 0 1 5.8 2.8a5.6 5.6 0 1 0 7.4 7.4z"/></svg>
    <span>Theme</span>
  </button>
</nav>
<main id="panels">
  <section id="panel-overview" class="panel active" role="tabpanel" aria-labelledby="tab-overview" tabindex="0"></section>
  <section id="panel-sensing" class="panel" role="tabpanel" aria-labelledby="tab-sensing" tabindex="0" hidden></section>
  <section id="panel-rffield" class="panel" role="tabpanel" aria-labelledby="tab-rffield" tabindex="0" hidden></section>
  <section id="panel-research" class="panel" role="tabpanel" aria-labelledby="tab-research" tabindex="0" hidden></section>
  <section id="panel-system" class="panel" role="tabpanel" aria-labelledby="tab-system" tabindex="0" hidden></section>
</main>
<footer class="foot">
  <span id="provenance-line">provenance: loading…</span>
  <span>RF Vision research instrument — estimates are not conclusions</span>
</footer>
<script type="module" src="/static/js/app.js"></script>
</body>
</html>
